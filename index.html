<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F2EADB">
  <title>Название кофейни</title>

  <!-- ============================================================
       НАСТРОЙКИ. Здесь меняются название, ссылки, график и меню.
       Больше нигде в файле ничего править не нужно.
       ============================================================ -->
  <script>
    const SETTINGS = {
      // Фото лежат в одной папке с index.html. Оставь "" — и этот блок скроется.
      // Для галереи можно писать просто имя файла: gallery: ["a.jpg", "b.jpg"]
      photos: {
        hero: "out.png",
        heroAlt: "Терраса кофейни: гости сидят в деревянных шезлонгах под вывеской «Coffee is my love»",
        about: "",
        aboutAlt: "Интерьер кофейни",
        gallery: [
          { src: "coffee.png", alt: "Стаканчик с логотипом Open Coffee на фоне неоновой вывески" }
        ]
      },

      name: "Open coffe",
      slogan: "Свежий кофе в двух шагах от моря",

      // Номер для WhatsApp: только цифры, без плюса и пробелов
      whatsapp: "79935753865",
      // Ссылка на Telegram
      telegram: "https://t.me/yokolow",
      // Телефон для кнопки «Позвонить»: с плюсом, без пробелов
      phone: "+79935753865",

      about: "Мы небольшая кофейня в Анапе. Варим кофе из свежеобжаренных зёрен и печём десерты каждое утро. Заходите на чашечку по пути к морю или на работу.",

      address: "г. Анапа, Супсехское шоссе, 4к1 ",
      // График: [дни, часы]. Можно добавлять и удалять строки
      hours: [
        ["Пн–Вс", "07:30–20:00"],
      ],
      // Ссылка на карту (в Яндекс Картах или Google Картах нажми «Поделиться»)
      mapLink: "https://yandex.ru/maps/-/CXc2jGjg"
    };

    // Меню: категории и позиции. Можно менять названия и цены (число без ₽),
    // добавлять и удалять позиции. Описание (desc) можно убрать.
    const MENU = [
      {
        category: "Кофе",
        items: [
          { name: "Эспрессо", price: 150 },
          { name: "Американо", price: 170 },
          { name: "Капучино", price: 220, desc: "Классика, 250 мл" },
          { name: "Латте", price: 240, desc: "Нежный, с молочной пенкой" },
          { name: "Раф", price: 280 }
        ]
      },
      {
        category: "Чай",
        items: [
          { name: "Чёрный чай", price: 150 },
          { name: "Зелёный чай", price: 150 },
          { name: "Облепиховый чай", price: 230, desc: "С мёдом" }
        ]
      },
      {
        category: "Десерты",
        items: [
          { name: "Круассан", price: 160 },
          { name: "Чизкейк", price: 250 },
          { name: "Булочка с маком", price: 130 }
        ]
      }
    ];
  </script>

  <!-- Шрифты Google Fonts. Если не загрузятся, подставятся Georgia и системный шрифт -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ============ ЦВЕТА И ШРИФТЫ: меняются здесь ============ */
    :root {
      --paper:   #F2EADB;  /* фон страницы */
      --paper-2: #E9DDC8;  /* второй оттенок бумаги: фон блока «Как нас найти», заглушки фото */
      --ink:     #2A1A12;  /* тёмно-коричневый: текст, тёмные блоки */
      --accent:  #A9412F;  /* терракотовый акцент, используется редко */
      --muted:   #66564B;  /* приглушённый текст (описания, слоган) */
      --paper-dim: rgba(242, 234, 219, 0.78); /* приглушённый текст на тёмном */
      --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --sans: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --gutter: clamp(20px, 5vw, 64px);
    }

    /* ============ Основа ============ */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
    }
    body {
      margin: 0;
      overflow-x: clip; /* страница не раздвигается вширь */
      background: var(--paper);
      color: var(--ink);
      font: 400 1.0625rem/1.6 var(--sans);
    }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    [hidden] { display: none !important; }
    ::selection { background: var(--accent); color: var(--paper); }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    .order :focus-visible, footer :focus-visible { outline-color: var(--paper); }

    .wrap {
      width: 100%;
      max-width: 1180px;
      margin-inline: auto;
      padding-inline: var(--gutter);
    }
    .section { padding-block: clamp(56px, 9vw, 112px); }

    h2 {
      margin: 0;
      font: 600 clamp(2.6rem, 6vw, 4.25rem)/1 var(--serif);
      letter-spacing: -0.015em;
      text-wrap: balance;
    }
    .badge {
      margin-left: 0.5rem;
      font: 400 0.875rem/1 var(--sans);
      letter-spacing: 0;
      color: var(--muted);
    }

    /* Левая узкая колонка и правая широкая: общая сетка блоков */
    .split { display: grid; gap: 28px; }
    .split > *, .menu-grid > *, .where-grid > * { min-width: 0; }
    @media (min-width: 900px) {
      .split {
        grid-template-columns: minmax(0, 4fr) minmax(0, 7fr);
        column-gap: clamp(48px, 7vw, 104px);
        align-items: start;
      }
    }

    /* ============ Кнопки ============ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 12px 18px;
      border: 1.5px solid var(--ink);
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      font: 600 1rem/1.2 var(--sans);
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }
    .btn:hover { background: var(--ink); color: var(--paper); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
    .btn-primary:hover { background: var(--ink); border-color: var(--ink); }
    .btn-dark { background: var(--ink); color: var(--paper); }
    .btn-dark:hover { background: var(--accent); border-color: var(--accent); }
    .btn[aria-disabled="true"] { opacity: 0.5; pointer-events: none; }

    /* ============ Фото ============ */
    /* Высота фото задаётся через --ratio (проценты от ширины). Работает на любых телефонах */
    .photo { position: relative; margin: 0; overflow: hidden; background: var(--paper-2); }
    .photo::before { content: ""; display: block; padding-top: var(--ratio, 125%); }
    .photo img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ============ Первый экран ============ */
    .hero { display: grid; overflow: hidden; background: var(--paper); }
    .hero > * { min-width: 0; }
    .hero-text { padding: clamp(40px, 10vw, 72px) var(--gutter) 36px; align-self: center; }
    .hero h1 {
      margin: 0 0 20px;
      font: 600 clamp(3.75rem, 18vw, 7rem)/0.9 var(--serif);
      letter-spacing: -0.02em;
      text-wrap: balance;
      overflow-wrap: anywhere;
    }
    .slogan {
      margin: 0 0 30px;
      max-width: 24ch;
      font-size: clamp(1.15rem, 3.6vw, 1.4rem);
      line-height: 1.4;
      color: var(--muted);
    }
    .hero-buttons { display: grid; gap: 10px; max-width: 420px; }
    @media (min-width: 480px) {
      .hero-buttons { grid-template-columns: 1fr 1fr; max-width: 520px; }
      .hero-buttons .btn-primary { grid-column: 1 / -1; }
    }

    /* На телефоне фото идёт от края до края под текстом */
    .hero-photo { --ratio: 120%; }
    .hero-photo img { object-position: 50% 40%; }
    .hero.no-photo .hero-photo { display: none; }

    @media (min-width: 900px) {
      .hero {
        grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr);
        min-height: 100vh;
        min-height: 100svh;
      }
      .hero.no-photo { grid-template-columns: 1fr; }
      .hero-text { padding: 64px var(--gutter); }
      .hero h1 { font-size: clamp(5.5rem, 9.5vw, 9rem); }
      .hero-photo { min-height: 560px; }
      .hero-photo::before { display: none; }
    }

    /* ============ Меню ============ */
    .menu-grid {
      display: grid;
      gap: 32px;
      grid-template-areas: "title" "list" "photo";
    }
    .menu-title { grid-area: title; }
    #menu-root { grid-area: list; }
    .gallery { grid-area: photo; display: grid; gap: 16px; max-width: 480px; }
    .gallery:empty { display: none; }
    .gallery .photo { --ratio: 100%; }
    .gallery .photo img { object-position: 50% 62%; }
    @media (min-width: 900px) {
      .menu-grid {
        grid-template-columns: minmax(0, 4fr) minmax(0, 7fr);
        grid-template-rows: auto 1fr;
        grid-template-areas: "title list" "photo list";
        column-gap: clamp(48px, 7vw, 104px);
        row-gap: 32px;
        align-items: start;
      }
      .gallery { max-width: none; position: sticky; top: 24px; }
      .gallery .photo { --ratio: 125%; }
    }

    #menu-root .card {
      margin: 0 0 clamp(40px, 6vw, 64px);
      padding: 0;
      background: none;
      border: 0;
    }
    #menu-root .card:last-child { margin-bottom: 0; }
    #menu-root .card h3 {
      margin: 0 0 10px;
      padding-bottom: 10px;
      border-bottom: 1.5px solid var(--ink);
      font: 600 clamp(1.9rem, 4vw, 2.5rem)/1.05 var(--serif);
    }

    /* Строка меню: название ........ цена [+] */
    .menu-item {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      column-gap: 8px;
      padding: 4px 0;
      font-weight: 500;
    }
    .menu-name { display: contents; }
    .menu-item::after {
      content: "";
      order: 2;
      flex: 1 1 12px;
      border-bottom: 2px dotted rgba(42, 26, 18, 0.45);
      transform: translateY(-2px);
    }
    .menu-price {
      order: 3;
      min-width: 3.4rem;
      text-align: right;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .menu-desc {
      order: 5;
      flex: 0 0 100%;
      margin: -6px 0 8px;
      font-size: 0.875rem;
      font-weight: 400;
      line-height: 1.4;
      color: var(--muted);
    }

    /* Кнопки «+» и «−»: зона нажатия 44px, видимый кружок поменьше */
    .round-btn {
      order: 4;
      position: relative;
      isolation: isolate;
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: 500 1.25rem/1 var(--sans);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s;
    }
    .round-btn::before {
      content: "";
      position: absolute;
      inset: 8px;
      z-index: -1;
      border: 1.5px solid currentColor;
      border-radius: 50%;
      transition: background-color 0.15s, border-color 0.15s, transform 0.1s;
    }
    .round-btn:hover { color: var(--paper); }
    .round-btn:hover::before { background: var(--accent); border-color: var(--accent); }
    .round-btn:active::before { transform: scale(0.88); }

    /* ============ Заказ (тёмная полоса) ============ */
    .order { background: var(--ink); color: var(--paper); }
    .empty { margin: 0; max-width: 34ch; color: var(--paper-dim); }
    .cart-list { list-style: none; margin: 0; padding: 0; }
    .cart-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 16px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid rgba(242, 234, 219, 0.22);
    }
    .cart-name { grid-column: 1 / -1; font-weight: 500; }
    .qty { display: flex; align-items: center; }
    .qty .round-btn { order: 0; }
    .qty-num { min-width: 28px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
    .cart-sum { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
    @media (min-width: 560px) {
      .cart-row { grid-template-columns: 1fr auto 6rem; }
      .cart-name { grid-column: auto; }
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      margin: 20px 0 24px;
      font: 600 clamp(1.75rem, 4vw, 2.25rem)/1.1 var(--serif);
      font-variant-numeric: lining-nums tabular-nums;
    }
    .order-actions { display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
    .order .btn-primary { background: var(--paper); border-color: var(--paper); color: var(--ink); }
    .order .btn-primary:hover { background: var(--accent); border-color: var(--accent); color: var(--paper); }
    .btn-link {
      min-height: 44px;
      padding: 0 8px;
      border: 0;
      background: none;
      color: var(--paper-dim);
      font: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }
    .btn-link:hover { color: var(--paper); }
    @media (min-width: 560px) {
      .order-actions { flex-direction: row; align-items: center; gap: 24px; }
    }

    /* ============ О нас ============ */
    .about-text {
      margin: 0;
      max-width: 30em;
      font: 500 clamp(1.5rem, 3.2vw, 2.1rem)/1.3 var(--serif);
    }
    .about-photo { --ratio: 75%; margin-top: 32px; max-width: 560px; }

    /* ============ Как нас найти ============ */
    .where { background: var(--paper-2); }
    .where-grid {
      display: grid;
      gap: 28px;
      margin-top: clamp(28px, 5vw, 48px);
      grid-template-areas: "addr" "hours" "btn";
    }
    .where-address {
      grid-area: addr;
      margin: 0;
      font: 600 clamp(1.7rem, 4vw, 2.6rem)/1.15 var(--serif);
    }
    #hours { grid-area: hours; }
    #map-link { grid-area: btn; justify-self: start; }
    @media (min-width: 900px) {
      .where-grid {
        grid-template-columns: minmax(0, 7fr) minmax(0, 4fr);
        grid-template-areas: "addr hours" "btn hours";
        column-gap: clamp(48px, 7vw, 104px);
        row-gap: 32px;
        align-items: start;
      }
    }
    .hours-row { display: flex; align-items: baseline; gap: 10px; padding: 6px 0; }
    .hours-row span { order: 1; }
    .hours-row::after {
      content: "";
      order: 2;
      flex: 1 1 16px;
      border-bottom: 2px dotted rgba(42, 26, 18, 0.45);
      transform: translateY(-2px);
    }
    .hours-row strong { order: 3; font-weight: 600; font-variant-numeric: tabular-nums; }

    /* ============ Подвал ============ */
    footer { background: var(--ink); color: var(--paper); padding: 40px 0; }
    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px 32px;
    }
    .footer-links { display: flex; flex-wrap: wrap; gap: 0 24px; }
    .footer-links a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      font-weight: 500;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }
    .footer-copy { margin: 0; font-size: 0.875rem; color: var(--paper-dim); }

    /* ============ Появление при прокрутке ============ */
    @media (prefers-reduced-motion: no-preference) {
      .reveal { opacity: 0; transform: translateY(14px); transition: opacity 0.7s ease, transform 0.7s ease; }
      .reveal.is-visible { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  <header class="hero" id="top">
    <div class="hero-text">
      <h1 data-fill="name"></h1>
      <p class="slogan" id="slogan"></p>
      <div class="hero-buttons">
        <a class="btn btn-primary" data-link="whatsapp" target="_blank" rel="noopener">Написать в WhatsApp</a>
        <a class="btn" data-link="telegram" target="_blank" rel="noopener">Написать в Telegram</a>
        <a class="btn" data-link="phone">Позвонить</a>
      </div>
    </div>
    <figure class="photo hero-photo" id="hero-photo"><img id="hero-img" alt=""></figure>
  </header>

  <main>
    <section class="section menu" id="menu">
      <div class="wrap menu-grid">
        <h2 class="menu-title">Меню <span class="badge">пример</span></h2>
        <div id="menu-root"></div>
        <div class="gallery" id="gallery"></div>
      </div>
    </section>

    <section class="section order" id="order">
      <div class="wrap split">
        <h2>Ваш заказ</h2>
        <div class="order-body">
          <p class="empty" id="cart-empty">Пока пусто. Нажмите «+» рядом с любой позицией меню.</p>
          <ul class="cart-list" id="cart-list"></ul>
          <div id="cart-footer" hidden>
            <div class="total-row"><span>Итого</span><span id="total">0 ₽</span></div>
            <div class="order-actions">
              <a class="btn btn-primary" id="send-order" target="_blank" rel="noopener">Отправить заказ в WhatsApp</a>
              <button class="btn-link" id="clear" type="button">Очистить заказ</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="section about" id="about">
      <div class="wrap split">
        <h2>О нас</h2>
        <div class="about-body">
          <p class="about-text" id="about-text"></p>
          <figure class="photo about-photo" id="about-photo" hidden><img id="about-img" alt=""></figure>
        </div>
      </div>
    </section>

    <section class="section where" id="where">
      <div class="wrap">
        <h2>Как нас найти</h2>
        <div class="where-grid">
          <p class="where-address" id="address"></p>
          <div id="hours"></div>
          <a class="btn btn-dark" id="map-link" target="_blank" rel="noopener">Открыть на карте</a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap footer-inner">
      <div class="footer-links">
        <a data-link="whatsapp" target="_blank" rel="noopener">WhatsApp</a>
        <a data-link="telegram" target="_blank" rel="noopener">Telegram</a>
        <a data-link="phone">Позвонить</a>
      </div>
      <p class="footer-copy">© <span id="year"></span> <span data-fill="name"></span></p>
    </div>
  </footer>

  <script>
    (function () {
      // Вспомогательная функция: создаёт элемент с классом и текстом
      function el(tag, className, text) {
        const e = document.createElement(tag);
        if (className) e.className = className;
        if (text !== undefined) e.textContent = text;
        return e;
      }
      function makeBtn(label, ariaLabel, onClick) {
        const b = el("button", "round-btn", label);
        b.type = "button";
        b.setAttribute("aria-label", ariaLabel);
        b.addEventListener("click", onClick);
        return b;
      }
      function waLink(text) {
        return "https://wa.me/" + SETTINGS.whatsapp + (text ? "?text=" + encodeURIComponent(text) : "");
      }

      /* ----- Название, слоган, ссылки, адрес, график ----- */
      document.title = SETTINGS.name;
      document.querySelectorAll("[data-fill='name']").forEach(function (n) {
        n.textContent = SETTINGS.name;
      });
      document.getElementById("slogan").textContent = SETTINGS.slogan;
      document.getElementById("about-text").textContent = SETTINGS.about;
      document.getElementById("address").textContent = SETTINGS.address;
      document.getElementById("year").textContent = new Date().getFullYear();
      document.getElementById("map-link").href = SETTINGS.mapLink;

      document.querySelectorAll("[data-link]").forEach(function (a) {
        const type = a.dataset.link;
        if (type === "whatsapp") a.href = waLink();
        if (type === "telegram") a.href = SETTINGS.telegram;
        if (type === "phone") a.href = "tel:" + SETTINGS.phone;
      });

      const hoursBox = document.getElementById("hours");
      SETTINGS.hours.forEach(function (row) {
        const r = el("div", "hours-row");
        r.appendChild(el("span", "", row[0]));
        r.appendChild(el("strong", "", row[1]));
        hoursBox.appendChild(r);
      });

      /* ----- Меню и корзина ----- */
      const cart = {};   // ключ: номер позиции, значение: сколько штук
      const byId = {};   // быстрый поиск позиции по номеру

      const cartList = document.getElementById("cart-list");
      const cartEmpty = document.getElementById("cart-empty");
      const cartFooter = document.getElementById("cart-footer");
      const totalEl = document.getElementById("total");
      const sendLink = document.getElementById("send-order");

      function changeQty(id, delta) {
        const next = (cart[id] || 0) + delta;
        if (next <= 0) delete cart[id]; else cart[id] = next;
        renderCart();
      }

      const menuRoot = document.getElementById("menu-root");
      MENU.forEach(function (group, gi) {
        const card = el("div", "card");
        card.appendChild(el("h3", "", group.category));
        group.items.forEach(function (item, ii) {
          const id = gi + "-" + ii;
          byId[id] = item;

          const row = el("div", "menu-item");
          const name = el("div", "menu-name", item.name);
          if (item.desc) name.appendChild(el("span", "menu-desc", item.desc));
          row.appendChild(name);
          row.appendChild(el("div", "menu-price", item.price + " ₽"));
          row.appendChild(makeBtn("+", "Добавить в заказ: " + item.name, function () {
            changeQty(id, 1);
          }));
          card.appendChild(row);
        });
        menuRoot.appendChild(card);
      });

      function renderCart() {
        cartList.innerHTML = "";
        let total = 0;
        const lines = [];

        Object.keys(cart).forEach(function (id) {
          const item = byId[id];
          const qty = cart[id];
          const sum = item.price * qty;
          total += sum;
          lines.push("• " + item.name + " × " + qty + " — " + sum + " ₽");

          const li = el("li", "cart-row");
          li.appendChild(el("span", "cart-name", item.name));

          const box = el("div", "qty");
          box.appendChild(makeBtn("−", "Убрать одну порцию: " + item.name, function () { changeQty(id, -1); }));
          box.appendChild(el("span", "qty-num", String(qty)));
          box.appendChild(makeBtn("+", "Добавить ещё: " + item.name, function () { changeQty(id, 1); }));
          li.appendChild(box);

          li.appendChild(el("span", "cart-sum", sum + " ₽"));
          cartList.appendChild(li);
        });

        const hasItems = lines.length > 0;
        cartEmpty.hidden = hasItems;
        cartFooter.hidden = !hasItems;
        totalEl.textContent = total + " ₽";

        if (hasItems) {
          const text = "Здравствуйте! Хочу заказать с собой:\n" + lines.join("\n") + "\nИтого: " + total + " ₽";
          sendLink.href = waLink(text);
        } else {
          sendLink.removeAttribute("href");
        }
      }

      document.getElementById("clear").addEventListener("click", function () {
        Object.keys(cart).forEach(function (id) { delete cart[id]; });
        renderCart();
      });

      renderCart();
    })();
  </script>

  <!-- Фото и плавное появление блоков. Корзину и меню этот скрипт не трогает -->
  <script>
    (function () {
      const P = (typeof SETTINGS !== "undefined" && SETTINGS.photos) || {};

      function loadImg(img, src, alt, onFail, onOk, lazy) {
        img.addEventListener("error", onFail, { once: true });
        if (onOk) img.addEventListener("load", onOk, { once: true });
        img.alt = alt || "";
        img.decoding = "async";
        if (lazy) img.loading = "lazy";
        img.src = src;
      }

      // Первый экран: если фото нет, страница показывает только текст
      const hero = document.querySelector(".hero");
      if (P.hero) {
        loadImg(document.getElementById("hero-img"), P.hero,
          P.heroAlt || SETTINGS.name,
          function () { hero.classList.add("no-photo"); }, null, false);
      } else {
        hero.classList.add("no-photo");
      }

      // «О нас»: показываем фото, только если оно загрузилось
      if (P.about) {
        const fig = document.getElementById("about-photo");
        loadImg(document.getElementById("about-img"), P.about,
          P.aboutAlt || "Фото кофейни",
          function () { fig.hidden = true; },
          function () { fig.hidden = false; }, true);
      }

      // Галерея рядом с меню: каждое фото либо строка "файл.jpg", либо { src, alt }
      const gallery = document.getElementById("gallery");
      (P.gallery || []).forEach(function (item) {
        const src = typeof item === "string" ? item : item.src;
        const alt = typeof item === "string" ? "" : item.alt;
        if (!src) return;
        const fig = document.createElement("figure");
        fig.className = "photo";
        const img = document.createElement("img");
        loadImg(img, src, alt || ("Фото: " + SETTINGS.name),
          function () { fig.remove(); }, null, true);
        fig.appendChild(img);
        gallery.appendChild(fig);
      });

      // Плавное появление блоков при прокрутке
      const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce || !("IntersectionObserver" in window)) return;

      const io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            e.target.classList.add("is-visible");
            io.unobserve(e.target);
          }
        });
      }, { threshold: 0.1, rootMargin: "0px 0px -6% 0px" });

      document.querySelectorAll(
        ".menu-title, .gallery, #menu-root .card, .order h2, .order-body, .about h2, .about-body, .where h2, .where-grid"
      ).forEach(function (n) {
        n.classList.add("reveal");
        io.observe(n);
      });
    })();
  </script>
</body>
